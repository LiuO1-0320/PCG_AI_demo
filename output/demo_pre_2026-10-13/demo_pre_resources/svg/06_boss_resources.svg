<text x="500.195554945204" y="610.75" font-family="Microsoft YaHei" font-size="25" font-weight="400" fill="#183444">Boss</text>
<text x="960" y="220.57999999999998" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">资源组件</text>
<text x="960" y="275.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">一个 4500×4500 cm 场地。</text>
<text x="960" y="312.06" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">高台、坡道、柱形 / 矮墙 / L 形掩体。</text>
<text x="960" y="348.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">一个 Boss、一个补给点和灯光。</text>
<text x="960" y="470.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">可走高低空间</text>
<text x="960" y="525.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">紫色是平台，米黄色是坡道。</text>
<text x="960" y="562.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">绿色虚线表示预留的中央通路。</text>
<text x="960" y="598.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">平台最高 320 cm，需导航可达。</text>
<text x="960" y="721.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">战斗资源</text>
<text x="960" y="776.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">球形弹体、地面预警圆盘、Boss 血条。</text>
<text x="960" y="813.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">击败后出现上楼 / 通关传送阵。</text>
<text x="960" y="849.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">地面技沿玩家所在表面设置高度。</text>
<text x="64" y="1048.01" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#586D7C">来源：CastleRegions.cpp、CastleGameplay.cpp。默认 10 组基础掩体，另加平台上的掩体。</text></svg>