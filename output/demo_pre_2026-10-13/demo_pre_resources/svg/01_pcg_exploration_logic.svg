<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="12" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="64" y="85.75999999999999" font-family="Microsoft YaHei" font-size="48" font-weight="700" fill="#183444">探索区 PCG：约束拓扑生成</text>
<text x="66" y="137.49" font-family="Microsoft YaHei" font-size="27" font-weight="400" fill="#586D7C">PCG_Exploration：4×4 候选格中生成 10–12 个房间，支持同种子复现</text>
<rect x="76" y="182" width="1100" height="104" rx="12" fill="#E7F2FA" stroke="#78909C" stroke-width="2"/>
<text x="293.32501220703125" y="223.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">1  种子＋楼层，分离拓扑随机流、房间类型随机流</text>
<polyline points="626,286 626,314" fill="none" stroke="#78909C" stroke-width="3"/>
<polygon points="626,314 619.8835932041064,300.30366589531536 632.1164067958936,300.30366589531536" fill="#78909C"/>
<rect x="76" y="314" width="1100" height="104" rx="12" fill="#E7F2FA" stroke="#78909C" stroke-width="2"/>
<text x="268.6199951171875" y="355.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">2  从格 0 到格 15，每次向东或向北，生成七房主路线</text>
<polyline points="626,418 626,446" fill="none" stroke="#78909C" stroke-width="3"/>
<polygon points="626,446 619.8835932041064,432.30366589531536 632.1164067958936,432.30366589531536" fill="#78909C"/>
<rect x="76" y="446" width="1100" height="104" rx="12" fill="#E7F2FA" stroke="#78909C" stroke-width="2"/>
<text x="228.7550048828125" y="487.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">3  从相邻空格扩展 3–5 个节点，每个新房至少连接一个旧房</text>
<polyline points="626,550 626,578" fill="none" stroke="#78909C" stroke-width="3"/>
<polygon points="626,578 619.8835932041064,564.3036658953154 632.1164067958936,564.3036658953154" fill="#78909C"/>
<rect x="76" y="578" width="1100" height="104" rx="12" fill="#E7F2FA" stroke="#78909C" stroke-width="2"/>
<text x="278.32501220703125" y="619.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">4  添加最多两条可选连接，形成替代入口到出口路线</text>
<polyline points="626,682 626,710" fill="none" stroke="#78909C" stroke-width="3"/>
<polygon points="626,710 619.8835932041064,696.3036658953154 632.1164067958936,696.3036658953154" fill="#78909C"/>
<rect x="76" y="710" width="1100" height="104" rx="12" fill="#E7F2FA" stroke="#78909C" stroke-width="2"/>
<text x="221.85501098632812" y="751.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">5  检查数量和替代路线，最多尝试 64 次，失败用固定回退图</text>
<polyline points="626,814 626,842" fill="none" stroke="#78909C" stroke-width="3"/>
<polygon points="626,842 619.8835932041064,828.3036658953154 632.1164067958936,828.3036658953154" fill="#78909C"/>
<rect x="76" y="842" width="1100" height="104" rx="12" fill="#DCF3EE" stroke="#78909C" stroke-width="2"/>
<text x="233.32501220703125" y="883.1" font-family="Microsoft YaHei" font-size="30" font-weight="400" fill="#183444">6  分配房间功能，生成实体，输出房间点与门方向等元数据</text>
<text x="1250" y="225.57999999999998" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">保证的主路线</text>
<text x="1250" y="280.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">入口 → 战斗 → 战斗 → 商店</text>
<text x="1250" y="317.06" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">→ 战斗 → 休息 → 出口</text>
<text x="1250" y="452.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">支路功能</text>
<text x="1250" y="507.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">至少一个宝箱房和额外战斗房。</text>
<text x="1250" y="544.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">从事件、精英、机关中选 1–2 种。</text>
<text x="1250" y="680.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">连通性与进度</text>
<text x="1250" y="735.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">移除一条主路边后，出口仍可达，</text>
<text x="1250" y="772.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">才认定存在替代路线。</text>
<text x="1250" y="808.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">一层普通出口上楼，后两层接 Boss。</text>
<text x="64" y="1048.01" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#586D7C">来源：CastleNodeLayout.cpp、CastleGeneration.cpp。算法示意图，非 UE 编辑器 PCG 节点截图。</text></svg>