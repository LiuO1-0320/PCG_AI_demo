<text x="940" y="278.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">房间 1：进入藏宝洞。</text>
<text x="940" y="315.06" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">房间 3 / 2：守卫＋宝箱。</text>
<text x="940" y="351.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">房间 0：第三个宝箱＋返回出口。</text>
<text x="940" y="462.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">生成资源</text>
<text x="940" y="517.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">四个房间壳、三段走廊。</text>
<text x="940" y="554.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">三个宝箱、一个返回门。</text>
<text x="940" y="590.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">二层每个中间房两个守卫。</text>
<text x="940" y="627.72" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">中间房各一组掩体，房间配冷色灯光。</text>
<text x="940" y="749.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">空间参数</text>
<text x="940" y="804.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">半边长 800 cm，图块中心距 2100 cm。</text>
<text x="940" y="841.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">未激活图块不生成实体。</text>
<text x="940" y="877.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">房间点的 RouteOrder 为 0–3。</text>
<text x="64" y="1048.01" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#586D7C">依据：CastleRegions1337.log 与 CastleRegions.cpp。宝箱与角色是占位几何体，非已经完成的主题美术资产。</text></svg>