<text x="990" y="553.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">普通守卫、精英守卫、机关触发区。</text>
<text x="990" y="589.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">后两层宝箱房旁设藏宝洞入口。</text>
<text x="990" y="699.58" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#183444">区域衔接</text>
<text x="990" y="754.23" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">一层出口直接上楼。</text>
<text x="990" y="791.0600000000001" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">二、三层出口房设 Boss 入口。</text>
<text x="990" y="827.89" font-family="Microsoft YaHei" font-size="29" font-weight="400" fill="#586D7C">小地图逐步揭示相邻房间类型。</text>
<text x="64" y="1048.01" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#586D7C">符号表示功能对象，非独立美术模型。图中未画事件房，实际可随机生成事件、精英、机关中的 1–2 种。</text></svg>